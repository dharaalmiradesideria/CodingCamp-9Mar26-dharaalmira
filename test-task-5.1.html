<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5.1 Test - TaskListComponent Data Model</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .test-result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 3px;
    }
    .pass {
      background-color: #d4edda;
      color: #155724;
    }
    .fail {
      background-color: #f8d7da;
      color: #721c24;
    }
    button {
      margin: 5px;
      padding: 8px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Task 5.1 Test: TaskListComponent Data Model</h1>
  
  <div class="test-section">
    <h2>Test Controls</h2>
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearStorage()">Clear Local Storage</button>
    <button onclick="viewStorage()">View Storage</button>
  </div>

  <div id="test-results"></div>
  <div id="tasks-section"></div>

  <script src="js/app.js"></script>
  <script>
    const resultsDiv = document.getElementById('test-results');
    const storageKey = 'productivity-dashboard-tasks';

    function logResult(testName, passed, message) {
      const div = document.createElement('div');
      div.className = `test-result ${passed ? 'pass' : 'fail'}`;
      div.innerHTML = `<strong>${testName}:</strong> ${passed ? 'PASS' : 'FAIL'} - ${message}`;
      resultsDiv.appendChild(div);
    }

    function clearStorage() {
      localStorage.removeItem(storageKey);
      resultsDiv.innerHTML = '<div class="test-result pass">Local Storage cleared</div>';
    }

    function viewStorage() {
      const data = localStorage.getItem(storageKey);
      const div = document.createElement('div');
      div.className = 'test-result';
      div.innerHTML = `<strong>Storage Content:</strong><br><pre>${data || 'Empty'}</pre>`;
      resultsDiv.appendChild(div);
    }

    function runAllTests() {
      resultsDiv.innerHTML = '<h2>Test Results</h2>';
      
      // Clear storage before tests
      localStorage.removeItem(storageKey);

      // Test 1: Constructor initialization
      try {
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        
        logResult('Test 1.1', 
          component.container === container, 
          'Constructor stores container element');
        
        logResult('Test 1.2', 
          component.storageKey === storageKey, 
          'Constructor stores storage key');
        
        logResult('Test 1.3', 
          Array.isArray(component.tasks), 
          'Constructor initializes tasks array');
      } catch (error) {
        logResult('Test 1', false, `Constructor failed: ${error.message}`);
      }

      // Test 2: loadTasks with empty storage
      try {
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        component.loadTasks();
        
        logResult('Test 2.1', 
          Array.isArray(component.tasks) && component.tasks.length === 0, 
          'loadTasks initializes empty array when no data exists');
      } catch (error) {
        logResult('Test 2.1', false, `loadTasks failed: ${error.message}`);
      }

      // Test 3: saveTasks and loadTasks with valid data
      try {
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        
        const testTasks = [
          { id: '1', text: 'Test task 1', completed: false, createdAt: Date.now() },
          { id: '2', text: 'Test task 2', completed: true, createdAt: Date.now() }
        ];
        
        component.tasks = testTasks;
        component.saveTasks();
        
        logResult('Test 3.1', 
          localStorage.getItem(storageKey) !== null, 
          'saveTasks writes to Local Storage');
        
        // Create new component and load
        const component2 = new TaskListComponent(container, storageKey);
        component2.loadTasks();
        
        logResult('Test 3.2', 
          component2.tasks.length === 2, 
          'loadTasks retrieves correct number of tasks');
        
        logResult('Test 3.3', 
          component2.tasks[0].text === 'Test task 1', 
          'loadTasks retrieves correct task data');
        
        logResult('Test 3.4', 
          component2.tasks[1].completed === true, 
          'loadTasks preserves task completion status');
      } catch (error) {
        logResult('Test 3', false, `Save/Load failed: ${error.message}`);
      }

      // Test 4: loadTasks with corrupted JSON
      try {
        localStorage.setItem(storageKey, 'invalid json {{{');
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        component.loadTasks();
        
        logResult('Test 4.1', 
          Array.isArray(component.tasks) && component.tasks.length === 0, 
          'loadTasks handles corrupted JSON gracefully');
      } catch (error) {
        logResult('Test 4.1', false, `Error handling failed: ${error.message}`);
      }

      // Test 5: loadTasks with invalid data type (not array)
      try {
        localStorage.setItem(storageKey, '{"not": "an array"}');
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        component.loadTasks();
        
        logResult('Test 5.1', 
          Array.isArray(component.tasks) && component.tasks.length === 0, 
          'loadTasks validates data is an array');
      } catch (error) {
        logResult('Test 5.1', false, `Validation failed: ${error.message}`);
      }

      // Test 6: init() method
      try {
        localStorage.removeItem(storageKey);
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        component.init();
        
        logResult('Test 6.1', 
          Array.isArray(component.tasks), 
          'init() calls loadTasks successfully');
      } catch (error) {
        logResult('Test 6.1', false, `init() failed: ${error.message}`);
      }

      // Test 7: Task data structure
      try {
        const container = document.getElementById('tasks-section');
        const component = new TaskListComponent(container, storageKey);
        
        const task = {
          id: 'test-123',
          text: 'Sample task',
          completed: false,
          createdAt: Date.now()
        };
        
        component.tasks = [task];
        component.saveTasks();
        
        const component2 = new TaskListComponent(container, storageKey);
        component2.loadTasks();
        const loadedTask = component2.tasks[0];
        
        logResult('Test 7.1', 
          typeof loadedTask.id === 'string', 
          'Task id is string type');
        
        logResult('Test 7.2', 
          typeof loadedTask.text === 'string', 
          'Task text is string type');
        
        logResult('Test 7.3', 
          typeof loadedTask.completed === 'boolean', 
          'Task completed is boolean type');
        
        logResult('Test 7.4', 
          typeof loadedTask.createdAt === 'number', 
          'Task createdAt is number type');
      } catch (error) {
        logResult('Test 7', false, `Data structure test failed: ${error.message}`);
      }

      // Clean up
      localStorage.removeItem(storageKey);
    }
  </script>
</body>
</html>
